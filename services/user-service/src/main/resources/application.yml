server:
  port: 8081
  shutdown: graceful

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:radius_user}${DB_OPTIONS:}
    username: ${DB_USER:radius}
    password: ${DB_PASSWORD:radius}
    hikari:
      maximum-pool-size: 10
      pool-name: user-pool
  jpa:
    open-in-view: false          # never let a view render trigger a query
    hibernate:
      ddl-auto: validate         # Flyway owns the schema
    properties:
      hibernate.jdbc.batch_size: 30
      hibernate.order_inserts: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5

radius:
  admin-phone: ${RADIUS_ADMIN_PHONE:}
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-at-least-32-bytes-long}
    access-ttl: 15m
    refresh-ttl: 30d
  otp:
    expose-code: ${OTP_EXPOSE_CODE:false}
  security:
    public-paths:
      - /actuator/health/**
      - /actuator/prometheus
      - /v3/api-docs/**
      - /swagger-ui/**
      - /api/auth/otp
      - /api/auth/verify
      - /api/auth/refresh
      # Browsing works without an account; the handlers treat a null caller as a guest.
      - /api/tags
      - /api/users/**
      - /api/professionals/**

management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true
  health.livenessstate.enabled: true
  health.readinessstate.enabled: true
  tracing.sampling.probability: 1.0
  otlp.tracing.endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://jaeger:4318/v1/traces}

springdoc:
  swagger-ui.path: /swagger-ui.html

---
spring:
  config.activate.on-profile: dev
  flyway:
    locations: classpath:db/migration,classpath:db/seed
radius:
  otp:
    expose-code: true            # the POC has no SMS provider; the code comes back in the response
logging:
  level:
    io.radius: DEBUG
