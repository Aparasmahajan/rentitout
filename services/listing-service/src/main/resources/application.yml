server:
  port: 8082
  shutdown: graceful

spring:
  application:
    name: listing-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:radius_listing}${DB_OPTIONS:}
    username: ${DB_USER:radius}
    password: ${DB_PASSWORD:radius}
    hikari:
      maximum-pool-size: 15
      pool-name: listing-pool
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
    properties:
      hibernate.jdbc.batch_size: 30
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties.enable.idempotence: true
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record
      missing-topics-fatal: false

radius:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-at-least-32-bytes-long}
  s3:
    bucket: ${S3_BUCKET:radius-photos}
    region: ${S3_REGION:us-east-1}
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    public-endpoint: ${S3_PUBLIC_ENDPOINT:http://localhost:9000}
    access-key: ${S3_ACCESS_KEY:radius}
    secret-key: ${S3_SECRET_KEY:radius-secret}
  security:
    public-paths:
      - /actuator/health/**
      - /actuator/prometheus
      - /v3/api-docs/**
      - /swagger-ui/**
      - /internal/**        # network-isolated, never routed by the gateway
    # Guests may browse. These are GET-only, so POST /api/listings/{id}/photos
    # and PATCH /api/listings/{id} still demand a token on the same paths.
    public-get-paths:
      - /api/feed
      - /api/listings/*
      - /api/listings/*/availability

management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true
  tracing.sampling.probability: 1.0
  otlp.tracing.endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://jaeger:4318/v1/traces}

---
spring:
  config.activate.on-profile: dev
# Listings are seeded through the API by infra/seed/seed.mjs, not by Flyway —
# owner ids live in another service's database and must not be guessed here.
logging:
  level:
    io.radius: DEBUG
