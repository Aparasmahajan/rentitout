<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,600;6..96,800&family=Karla:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; background: #FBFAF7; font-family: 'Karla', system-ui, sans-serif; }
    a { color: #131313; text-decoration: none; }
    a:hover { color: #7A4B2A; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #FBFAF7; color: #131313; display: flex; flex-direction: column; overflow: hidden;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 10px;">
    <span style="font-family: 'Bodoni Moda', Didot, serif; font-size: 23px; font-weight: 800;">Radius</span>
    <span style="font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: #6E6A63;">Kreuzberg &middot; 5 km</span>
  </div>

  <div style="padding: 4px 20px 16px;">
    <h1 style="margin: 0; font-family: 'Bodoni Moda', Didot, serif; font-size: 42px; font-weight: 400; line-height: 0.98; letter-spacing: -0.025em;">Within <em style="font-style: italic; color: {{accent}};">five</em> kilometres</h1>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px; padding: 0 20px; flex-grow: 1;">

    <div style="position: relative; height: 268px; border-radius: 4px; overflow: hidden; background: linear-gradient(148deg, #C4B79E 0%, #9E8F76 46%, #6E6252 100%);">
      <div style="position: absolute; inset: 0; background-image: repeating-linear-gradient(0deg, rgba(255,255,255,0.05) 0 1px, transparent 1px 3px);"></div>
      <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 18px; background: linear-gradient(transparent, rgba(0,0,0,0.66)); display: flex; flex-direction: column; gap: 7px;">
        <span style="font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(255,255,255,0.82);">To rent &middot; 100 m away</span>
        <h2 style="margin: 0; font-family: 'Bodoni Moda', Didot, serif; font-size: 29px; font-weight: 400; line-height: 1.04; color: #FFFFFF;">Aluminium ladder, 3 m</h2>
        <div style="display: flex; align-items: baseline; gap: 8px;">
          <span style="font-family: 'Bodoni Moda', Didot, serif; font-size: 24px; color: #FFFFFF;">€5</span>
          <span style="font-size: 12px; color: rgba(255,255,255,0.78);">a day &middot; Amara Okafor</span>
        </div>
      </div>
    </div>

    <sc-for list="{{rest}}" as="item" hint-placeholder-count="2">
      <div style="position: relative; height: 152px; border-radius: 4px; overflow: hidden; background: {{item.wash}};">
        <div style="position: absolute; inset: 0; background-image: repeating-linear-gradient(0deg, rgba(255,255,255,0.05) 0 1px, transparent 1px 3px);"></div>
        <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px; background: linear-gradient(transparent, rgba(0,0,0,0.62)); display: flex; flex-direction: column; gap: 5px;">
          <span style="font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(255,255,255,0.8);">{{item.kind}} &middot; {{item.distance}}</span>
          <h3 style="margin: 0; font-family: 'Bodoni Moda', Didot, serif; font-size: 21px; font-weight: 400; line-height: 1.08; color: #FFFFFF;">{{item.title}}</h3>
          <span style="font-size: 12px; color: rgba(255,255,255,0.82);">{{item.price}}</span>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-top: 1px solid #E4E1DA; margin-top: 14px;">
    <div style="height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.6">
        <circle cx="12" cy="12" r="8.5"></circle>
        <circle cx="12" cy="12" r="2" fill="{{accent}}" stroke="none"></circle>
      </svg>
      <span style="font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: {{accent}};">Near</span>
    </div>
    <div style="height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9A958C" stroke-width="1.6" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"></circle>
        <path d="M20 20l-3.6-3.6"></path>
      </svg>
      <span style="font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: #9A958C;">Find</span>
    </div>
    <div style="height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9A958C" stroke-width="1.8" stroke-linecap="round">
        <path d="M12 5v14M5 12h14"></path>
      </svg>
      <span style="font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: #9A958C;">List</span>
    </div>
    <div style="height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9A958C" stroke-width="1.6" stroke-linejoin="round">
        <path d="M4 6h16v11H9l-5 4z"></path>
      </svg>
      <span style="font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: #9A958C;">Asks</span>
    </div>
    <div style="height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9A958C" stroke-width="1.6" stroke-linecap="round">
        <circle cx="12" cy="8.5" r="3.6"></circle>
        <path d="M5 20c1.4-3.6 4-5.4 7-5.4s5.6 1.8 7 5.4"></path>
      </svg>
      <span style="font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: #9A958C;">You</span>
    </div>
  </div>
</div>

</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844},"accent":{"editor":"color","default":"#7A4B2A","options":["#7A4B2A","#2F4C3A","#6B2E3E","#131313"]}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#7A4B2A',
      rest: [
        { kind: 'Teaching', distance: '200 m', title: 'Video editing, the basics', price: '€30 a session', wash: 'linear-gradient(160deg, #8E9BA8 0%, #5E6C7C 58%, #3D4854 100%)' },
        { kind: 'For hire', distance: '300 m', title: 'Electrician, small jobs',   price: '€35 an hour',   wash: 'linear-gradient(160deg, #C0A98C 0%, #8C7455 60%, #5C4A33 100%)' }
      ]
    };
  }
}
</script>
</body>
</html>
