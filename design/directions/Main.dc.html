<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
  <style>
    body { margin: 0; background: #F6F1E7; font-family: 'Instrument Sans', system-ui, sans-serif; }
    a { color: #1A1714; text-decoration: none; }
    a:hover { color: #D2481E; }
  </style>
</helmet>

<div style="width: 1120px; height: 820px; background: #F6F1E7; color: #1A1714; display: flex; flex-direction: column; overflow: hidden;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 22px 40px; border-bottom: 1px solid #E0D6C4;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.4">
        <circle cx="12" cy="12" r="9.5" stroke-dasharray="3 2.5"></circle>
        <circle cx="12" cy="12" r="2.6" fill="{{accent}}" stroke="none"></circle>
      </svg>
      <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 27px; letter-spacing: 0.02em;">Radius</span>
    </div>
    <div style="display: flex; align-items: center; gap: 30px; font-size: 14px;">
      <a href="#" style="border-bottom: 1.5px solid {{accent}}; padding-bottom: 2px;">Nearby</a>
      <a href="#" style="color: #6B6055;">Search</a>
      <a href="#" style="color: #6B6055;">List something</a>
      <a href="#" style="color: #6B6055;">Requests</a>
      <span style="width: 1px; height: 18px; background: #E0D6C4;"></span>
      <span style="font-size: 13px; color: #6B6055;">Kreuzberg</span>
    </div>
  </div>

  <div style="display: flex; align-items: flex-end; justify-content: space-between; padding: 30px 40px 20px;">
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <span style="font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #9C8F7E;">Twelve things within five kilometres</span>
      <h1 style="margin: 0; font-family: 'Instrument Serif', Georgia, serif; font-size: 54px; font-weight: 400; line-height: 1;">Nearby</h1>
    </div>
    <div style="display: flex; align-items: center; gap: 14px;">
      <span style="font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 19px; color: #6B6055;">within</span>
      <div style="display: flex; align-items: baseline; gap: 5px; border-bottom: 1.5px solid #1A1714; padding-bottom: 3px;">
        <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 30px;">5</span>
        <span style="font-size: 13px; color: #6B6055;">km</span>
      </div>
    </div>
  </div>

  <div style="display: flex; gap: 8px; padding: 0 40px 24px;">
    <span style="padding: 9px 16px; border-radius: 2px; background: #1A1714; color: #F6F1E7; font-size: 13px;">Everything</span>
    <span style="padding: 9px 16px; border-radius: 2px; border: 1px solid #D8CDB9; font-size: 13px; color: #4A4239;">To rent</span>
    <span style="padding: 9px 16px; border-radius: 2px; border: 1px solid #D8CDB9; font-size: 13px; color: #4A4239;">For hire</span>
    <span style="padding: 9px 16px; border-radius: 2px; border: 1px solid #D8CDB9; font-size: 13px; color: #4A4239;">Teaching</span>
    <span style="padding: 9px 16px; border-radius: 2px; border: 1px solid #D8CDB9; font-size: 13px; color: #4A4239;">For sale</span>
    <span style="padding: 9px 16px; border-radius: 2px; border: 1px solid #D8CDB9; font-size: 13px; color: #4A4239;">Wanted</span>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: #E0D6C4; border-top: 1px solid #E0D6C4; flex-grow: 1;">

    <sc-for list="{{cards}}" as="card" hint-placeholder-count="6">
      <div style="background: #FFFDF8; padding: 20px; display: flex; flex-direction: column; gap: 12px;">
        <div style="height: 116px; background-image: repeating-linear-gradient(-45deg, rgba(26,23,20,0.055) 0 1px, transparent 1px 9px); background-color: #EFE7D8; display: flex; align-items: center; justify-content: center;">
          <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 34px; color: rgba(26,23,20,0.3);">{{card.mark}}</span>
        </div>
        <span style="font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: #9C8F7E;">{{card.kind}}</span>
        <h3 style="margin: 0; font-family: 'Instrument Serif', Georgia, serif; font-size: 22px; font-weight: 400; line-height: 1.15;">{{card.title}}</h3>
        <div style="display: flex; align-items: baseline; justify-content: space-between; margin-top: auto; padding-top: 10px; border-top: 1px solid #EDE4D4;">
          <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 25px; color: {{accent}};">{{card.price}}</span>
          <span style="font-size: 12px; color: #6B6055;">{{card.distance}}</span>
        </div>
        <span style="font-size: 12px; color: #9C8F7E;">{{card.owner}}</span>
      </div>
    </sc-for>

  </div>
</div>

</x-dc>
<script data-dc-script data-props='{"$preview":{"width":1120,"height":820},"accent":{"editor":"color","default":"#D2481E","options":["#D2481E","#A8442A","#2F5D50","#7A5C2E"]}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#D2481E',
      cards: [
        { mark: 'AL', kind: 'To rent',  title: 'Aluminium ladder, 3 m',   price: '€5.00 / day',     distance: '100 m away', owner: 'Amara Okafor · Kreuzberg' },
        { mark: 'VE', kind: 'Teaching', title: 'Video editing, the basics', price: '€30.00 / session', distance: '200 m away', owner: 'Priya Raman · Kreuzberg' },
        { mark: 'EL', kind: 'For hire', title: 'Electrician, small jobs', price: '€35.00 / hour',   distance: '300 m away', owner: 'Amara Okafor · Kreuzberg' },
        { mark: 'PR', kind: 'To rent',  title: 'Projector + 2 m screen',  price: '€15.00 / day',    distance: '600 m away', owner: 'Erik Lindqvist · Kreuzberg' },
        { mark: 'CD', kind: 'To rent',  title: 'Cordless drill + bits',   price: '€4.00 / day',     distance: '2.3 km away', owner: 'Jonas Meyer · Neukölln' },
        { mark: 'CG', kind: 'To rent',  title: 'Camping gear for two',    price: '€12.00 / day',    distance: '2.5 km away', owner: 'Sofia Almeida · Neukölln' }
      ]
    };
  }
}
</script>
</body>
</html>
