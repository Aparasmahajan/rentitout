<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; background: #0B0F14; font-family: 'Space Grotesk', system-ui, sans-serif; }
    a { color: #E8EDF2; text-decoration: none; }
    a:hover { color: #5FE3A1; }
  </style>
</helmet>

<div style="width: 1120px; height: 820px; background: #0B0F14; color: #E8EDF2; display: flex; flex-direction: column; overflow: hidden;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 18px 32px; border-bottom: 1px solid #1C2733;">
    <div style="display: flex; align-items: center; gap: 11px;">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.5">
        <circle cx="12" cy="12" r="9.5" opacity="0.4"></circle>
        <circle cx="12" cy="12" r="5.5" opacity="0.7"></circle>
        <circle cx="12" cy="12" r="2" fill="{{accent}}" stroke="none"></circle>
      </svg>
      <span style="font-size: 21px; font-weight: 700; letter-spacing: -0.02em;">Radius</span>
    </div>
    <div style="display: flex; align-items: center; gap: 8px;">
      <a href="#" style="padding: 9px 16px; border-radius: 999px; background: #18222E; font-size: 13px; font-weight: 500;">Nearby</a>
      <a href="#" style="padding: 9px 16px; font-size: 13px; color: #8A97A6;">Search</a>
      <a href="#" style="padding: 9px 16px; font-size: 13px; color: #8A97A6;">Requests</a>
      <a href="#" style="padding: 10px 18px; border-radius: 999px; background: {{accent}}; color: #06110C; font-size: 13px; font-weight: 600; margin-left: 8px;">List something</a>
    </div>
  </div>

  <div style="display: flex; flex-grow: 1; overflow: hidden;">

    <div style="width: 396px; flex-shrink: 0; border-right: 1px solid #1C2733; position: relative; background: radial-gradient(circle at 50% 46%, #16212C 0%, #0D131A 62%, #0B0F14 100%); display: flex; align-items: center; justify-content: center;">
      <div style="position: absolute; width: 300px; height: 300px; border-radius: 50%; border: 1px solid rgba(95,227,161,0.16);"></div>
      <div style="position: absolute; width: 200px; height: 200px; border-radius: 50%; border: 1px solid rgba(95,227,161,0.24);"></div>
      <div style="position: absolute; width: 104px; height: 104px; border-radius: 50%; border: 1px solid rgba(95,227,161,0.34); background: rgba(95,227,161,0.05);"></div>
      <div style="position: absolute; width: 13px; height: 13px; border-radius: 50%; background: {{accent}}; box-shadow: 0 0 0 6px rgba(95,227,161,0.16);"></div>

      <span style="position: absolute; left: 154px; top: 176px; padding: 5px 11px; border-radius: 999px; background: #1D2A38; border: 1px solid #2C3D4F; font-size: 12px; font-weight: 600;">€5</span>
      <span style="position: absolute; left: 236px; top: 262px; padding: 5px 11px; border-radius: 999px; background: #1D2A38; border: 1px solid #2C3D4F; font-size: 12px; font-weight: 600;">€30</span>
      <span style="position: absolute; left: 106px; top: 322px; padding: 5px 11px; border-radius: 999px; background: #1D2A38; border: 1px solid #2C3D4F; font-size: 12px; font-weight: 600;">€35</span>
      <span style="position: absolute; left: 262px; top: 152px; padding: 5px 11px; border-radius: 999px; background: #1D2A38; border: 1px solid #2C3D4F; font-size: 12px; font-weight: 600;">€15</span>
      <span style="position: absolute; left: 74px; top: 232px; padding: 5px 11px; border-radius: 999px; background: #1D2A38; border: 1px solid #2C3D4F; font-size: 12px; font-weight: 600;">€12</span>

      <div style="position: absolute; left: 24px; bottom: 24px; display: flex; flex-direction: column; gap: 3px;">
        <span style="font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #6B7A8A;">Showing</span>
        <span style="font-size: 15px; font-weight: 600;">12 within 5 km</span>
      </div>
    </div>

    <div style="flex-grow: 1; display: flex; flex-direction: column; overflow: hidden;">
      <div style="display: flex; align-items: flex-end; justify-content: space-between; padding: 26px 30px 16px;">
        <div style="display: flex; flex-direction: column; gap: 5px;">
          <h1 style="margin: 0; font-size: 38px; font-weight: 700; letter-spacing: -0.035em; line-height: 1;">Nearby</h1>
          <span style="font-size: 13px; color: #8A97A6;">Kreuzberg, closest first</span>
        </div>
        <div style="display: flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 999px; border: 1px solid #2C3D4F;">
          <span style="font-size: 12px; color: #8A97A6;">Radius</span>
          <span style="font-size: 14px; font-weight: 600; color: {{accent}};">5 km</span>
        </div>
      </div>

      <div style="display: flex; gap: 7px; padding: 0 30px 18px;">
        <span style="padding: 8px 15px; border-radius: 999px; background: {{accent}}; color: #06110C; font-size: 12px; font-weight: 600;">Everything</span>
        <span style="padding: 8px 15px; border-radius: 999px; border: 1px solid #2C3D4F; font-size: 12px; color: #B9C4CF;">To rent</span>
        <span style="padding: 8px 15px; border-radius: 999px; border: 1px solid #2C3D4F; font-size: 12px; color: #B9C4CF;">For hire</span>
        <span style="padding: 8px 15px; border-radius: 999px; border: 1px solid #2C3D4F; font-size: 12px; color: #B9C4CF;">Teaching</span>
      </div>

      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; padding: 0 30px 24px; flex-grow: 1;">
        <sc-for list="{{cards}}" as="card" hint-placeholder-count="6">
          <div style="border-radius: 16px; background: #131A22; border: 1px solid #1F2A36; padding: 15px; display: flex; flex-direction: column; gap: 10px;">
            <div style="display: flex; align-items: center; justify-content: space-between;">
              <span style="padding: 4px 10px; border-radius: 999px; background: {{card.chipBg}}; color: {{card.chipInk}}; font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;">{{card.kind}}</span>
              <span style="font-size: 11px; color: #6B7A8A;">{{card.distance}}</span>
            </div>
            <h3 style="margin: 0; font-size: 17px; font-weight: 600; line-height: 1.2; letter-spacing: -0.015em;">{{card.title}}</h3>
            <div style="display: flex; align-items: baseline; gap: 5px;">
              <span style="font-size: 22px; font-weight: 700; color: {{accent}}; letter-spacing: -0.02em;">{{card.price}}</span>
              <span style="font-size: 12px; color: #8A97A6;">{{card.unit}}</span>
            </div>
            <div style="display: flex; align-items: center; gap: 8px; margin-top: auto; padding-top: 10px; border-top: 1px solid #1F2A36;">
              <div style="width: 24px; height: 24px; border-radius: 50%; background: #22303E; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600; color: #A9B6C3;">{{card.mark}}</div>
              <span style="font-size: 12px; color: #8A97A6;">{{card.owner}}</span>
            </div>
          </div>
        </sc-for>
      </div>
    </div>
  </div>
</div>

</x-dc>
<script data-dc-script data-props='{"$preview":{"width":1120,"height":820},"accent":{"editor":"color","default":"#5FE3A1","options":["#5FE3A1","#7C9CFF","#F5C25F","#FF7A6B"]}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#5FE3A1',
      cards: [
        { mark: 'AO', kind: 'To rent',  title: 'Aluminium ladder, 3 m',     price: '€5',  unit: '/ day',     distance: '100 m',  owner: 'Amara Okafor',   chipBg: '#1E3A2C', chipInk: '#7FE9B4' },
        { mark: 'PR', kind: 'Teaching', title: 'Video editing, the basics', price: '€30', unit: '/ session', distance: '200 m',  owner: 'Priya Raman',    chipBg: '#26314B', chipInk: '#9DB4FF' },
        { mark: 'AO', kind: 'For hire', title: 'Electrician, small jobs',   price: '€35', unit: '/ hour',    distance: '300 m',  owner: 'Amara Okafor',   chipBg: '#3A3320', chipInk: '#F0CE7E' },
        { mark: 'EL', kind: 'To rent',  title: 'Projector + 2 m screen',    price: '€15', unit: '/ day',     distance: '600 m',  owner: 'Erik Lindqvist', chipBg: '#1E3A2C', chipInk: '#7FE9B4' },
        { mark: 'JM', kind: 'To rent',  title: 'Cordless drill + bits',     price: '€4',  unit: '/ day',     distance: '2.3 km', owner: 'Jonas Meyer',    chipBg: '#1E3A2C', chipInk: '#7FE9B4' },
        { mark: 'SA', kind: 'To rent',  title: 'Camping gear for two',      price: '€12', unit: '/ day',     distance: '2.5 km', owner: 'Sofia Almeida',  chipBg: '#1E3A2C', chipInk: '#7FE9B4' }
      ]
    };
  }
}
</script>
</body>
</html>
